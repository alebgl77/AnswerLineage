[project]
name = "answerlineage-api"
version = "0.0.0"
description = "API d'AnswerLineage : ingestion des événements OpenLineage et lecture du graphe."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.121",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_api"]
