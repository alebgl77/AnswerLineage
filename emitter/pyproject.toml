[project]
name = "answerlineage-emitter"
version = "0.0.0"
description = "Émetteur d'AnswerLineage : ce que partagent le proxy et les adaptateurs pour décrire un appel d'outil sans contenu et l'envoyer à l'API."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Source = "https://github.com/alebgl77/AnswerLineage"
Documentation = "https://github.com/alebgl77/AnswerLineage/tree/main/docs"
Issues = "https://github.com/alebgl77/AnswerLineage/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_emitter"]
