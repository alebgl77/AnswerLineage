[project]
name = "answerlineage-workers"
version = "0.0.0"
description = "Workers d'AnswerLineage : projection des événements reçus dans le graphe de lignage."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "answerlineage-api==0.0.0",
    "sqlalchemy[asyncio]>=2.0.40",
]

[project.scripts]
answerlineage-worker = "answerlineage_workers.cli:main"

[project.urls]
Source = "https://github.com/alebgl77/AnswerLineage"
Documentation = "https://github.com/alebgl77/AnswerLineage/tree/main/docs"
Issues = "https://github.com/alebgl77/AnswerLineage/issues"

[tool.uv.sources]
answerlineage-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_workers"]
