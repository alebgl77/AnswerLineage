[project]
name = "answerlineage"
version = "0.0.0"
description = "Lignage et rappel des réponses d'agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.9",
    "httpx>=0.28",
    "jsonschema[format-nongpl]>=4.25",
    "mcp>=1.20",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pyyaml>=6.0",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.10",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false
# Délai de carence : aucune version publiée depuis moins de 7 jours (PRD, section 13).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["proxy", "adapters", "collector", "api", "workers", "mcp-server"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["proxy/src", "adapters/src", "collector/src", "api/src", "workers/src", "mcp-server/src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Chaque composant est une base de paquets : ses sources s'importent sous leur
# nom de distribution, ses tests sous <composant>.tests.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "proxy/src",
    "adapters/src",
    "collector/src",
    "api/src",
    "workers/src",
    "mcp-server/src",
    ".",
]
files = [
    "proxy",
    "adapters",
    "collector",
    "api",
    "workers",
    "mcp-server",
    "scripts",
    "tests",
    "conftest.py",
]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
pythonpath = ["."]
testpaths = ["tests", "proxy", "adapters", "collector", "api", "workers", "mcp-server"]
xfail_strict = true
markers = [
    "integration: test sur un PostgreSQL réel, démarré par Testcontainers (Docker requis)",
]

[tool.coverage.run]
branch = true
source = [
    "answerlineage_proxy",
    "answerlineage_adapters",
    "answerlineage_collector",
    "answerlineage_api",
    "answerlineage_workers",
    "answerlineage_mcp_server",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# Porte de couverture (ENF-MAIN-01) : chaque composant suivi tient le seuil, en
# couverture de branches comme en couverture combinée. Le moteur d'impact
# rejoint la liste avec sa première story.
[tool.answerlineage.coverage_gate]
minimum = 85
paths = [
    "proxy/src",
    "adapters/src",
    "collector/src",
    "api/src",
    "workers/src",
    "mcp-server/src",
]
