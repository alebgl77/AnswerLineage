[project]
name = "answerlineage"
version = "0.0.0"
description = "Lignage et rappel des réponses d'agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.9",
    "httpx>=0.28",
    "jsonschema[format-nongpl]>=4.25",
    "mcp>=1.20",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest-cov>=7.0",
    "pytest>=8.4",
    "pyyaml>=6.0",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.10",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false
# Délai de carence : une version publiée depuis moins de 7 jours n'est pas adoptée.
exclude-newer = "7 days"

[tool.uv.workspace]
members = [
    "api",
    "proxy",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "api/src",
    "proxy/src",
    ".",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Chaque composant est une base de paquets : ses sources s'importent sous leur
# nom de distribution, ses tests sous <composant>.tests.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "api/src",
    "proxy/src",
    ".",
]
files = [
    "api",
    "proxy",
    "scripts",
    "tests",
    "conftest.py",
]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
pythonpath = ["."]
testpaths = [
    "tests",
    "api",
    "proxy",
]
xfail_strict = true
markers = [
    "integration: test sur un PostgreSQL réel, démarré par Testcontainers (Docker requis)",
]

[tool.coverage.run]
branch = true
source = [
    "scripts",
    "api/src",
    "proxy/src",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# Porte de couverture : chaque chemin suivi tient le seuil, en couverture de
# branches comme en couverture combinée des lignes et des branches.
[tool.answerlineage.coverage_gate]
minimum = 85
paths = [
    "scripts",
    "api/src",
    "proxy/src",
]
