name: ci

on:
  pull_request:
    # Poser ou retirer un label relance la revue de la configuration d'agents.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Jeton en lecture seule : aucun job de ce pipeline n'écrit dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  static:
    name: Hygiène et analyse statique
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Le contrat de l'API se compare à celui de la branche cible.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Installe l'environnement verrouillé
        run: uv sync --all-packages --locked
      - name: Politique du dépôt
        run: make policy
      - name: Compatibilité de l'API avec le contrat publié
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make contract
      - name: Format
        run: make format-check
      - name: Lint
        run: make lint
      - name: Typage strict
        run: make typecheck

  tests:
    name: Tests (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        postgres: ["17", "18"]
    env:
      # Les tests d'intégration démarrent ce PostgreSQL avec Testcontainers.
      ANSWERLINEAGE_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Installe l'environnement verrouillé
        run: uv sync --all-packages --locked
      - name: Tests et couverture de branches
        # Les tests dans le navigateur ont leur propre job : explorer.
        run: make test PYTEST_ARGS='-m "not e2e"'
      - name: Porte de couverture (85 % par composant)
        run: make coverage-gate

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tout l'historique : un secret retiré depuis reste un secret publié.
          fetch-depth: 0
      - name: Vérifie que le détecteur bloque un secret
        run: scripts/gitleaks.sh selftest
      - name: Analyse de tout l'historique
        run: scripts/gitleaks.sh scan

  codeql:
    name: Analyse de sécurité du code (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Dépôt des résultats dans l'onglet Sécurité.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  agent-config:
    name: Revue de la configuration d'agents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # La comparaison avec la branche cible demande son historique.
          fetch-depth: 0
      - name: Exige l'approbation d'un mainteneur si un fichier protégé change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -m scripts.check_agent_config

  devcontainer:
    name: Conteneur de développement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construit le conteneur
        run: docker build --tag answerlineage-dev .devcontainer
      - name: Vérifie qu'il installe et contrôle le projet
        run: |
          docker run --rm --volume "$PWD:/src:ro" answerlineage-dev sh -c \
            'cp -r /src /tmp/projet && cd /tmp/projet && make setup && uv run pytest -m "not integration" -q'

  explorer:
    name: Explorateur
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Installe l'environnement verrouillé
        run: uv sync --all-packages --locked
      - name: Construit l'explorateur, après contrôle de ses types
        run: make ui
      - name: Installe Chromium
        run: uv run playwright install --with-deps chromium
      - name: Tests de bout en bout dans le navigateur
        run: make e2e

  demo:
    name: Démonstration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lance la démonstration, mesure le premier graphe, l'arrête et la relance
        run: scripts/check_demo.sh

  # Seul contrôle à exiger dans la protection de la branche principale : il
  # échoue dès qu'une étape bloquante échoue, est annulée ou est sautée.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [static, tests, secrets, codeql, agent-config, devcontainer, explorer, demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifie que toutes les étapes bloquantes sont vertes
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Étape bloquante non verte : $result"
              exit 1
            fi
          done
          echo "Toutes les étapes bloquantes sont vertes."
