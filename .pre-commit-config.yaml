# Hooks locaux uniquement : ils utilisent les outils verrouillés par uv.lock,
# sans télécharger de dépôt tiers au moment du commit.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: repository-policy
        name: politique du dépôt
        entry: uv run python -m scripts.check_policy
        language: system
        files: ^(\.github/|\.devcontainer/|scripts/.*\.sh$)|Dockerfile
        pass_filenames: false
