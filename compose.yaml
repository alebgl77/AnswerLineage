# Démonstration d'AnswerLineage : docker compose up
#
# Un PostgreSQL, l'API et son explorateur, un worker, et une entreprise
# synthétique chargée par l'API d'ingestion. L'explorateur est ensuite sur
# http://127.0.0.1:8000/ ; seul ce port est publié, et sur la boucle locale.

name: answerlineage

x-answerlineage: &answerlineage
  image: answerlineage-demo
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment:
    # Mot de passe de démonstration : la base n'est joignable que des services ci-dessous.
    ANSWERLINEAGE_DATABASE_URL: postgresql://answerlineage:answerlineage@postgres:5432/answerlineage

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: answerlineage
      POSTGRES_PASSWORD: answerlineage
      POSTGRES_DB: answerlineage
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      # Par TCP : pendant son initialisation, PostgreSQL n'écoute que sur son
      # socket, et un contrôle sans hôte le dirait prêt trop tôt.
      test:
        - CMD
        - pg_isready
        - --host
        - 127.0.0.1
        - --port
        - "5432"
        - --username
        - answerlineage
        - --dbname
        - answerlineage
      interval: 2s
      timeout: 3s
      retries: 30

  # Crée ou met à jour le schéma, puis s'arrête.
  migrate:
    <<: *answerlineage
    command: ["python", "-m", "answerlineage_api.store.migrate", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy

  # L'API n'accepte que la boucle locale dans Host : aucun autre nom, que le
  # réseau pourrait résoudre ailleurs. Son journal d'accès, qui écrirait les
  # paramètres des adresses demandées, est coupé.
  api:
    <<: *answerlineage
    command:
      - uvicorn
      - --factory
      - answerlineage_api.app:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/openapi.json', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *answerlineage
    command: ["answerlineage-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Envoie l'entreprise synthétique à l'API, puis s'arrête. Relancé, il ne
  # change rien : un événement déjà reçu n'est enregistré qu'une fois. Il
  # partage l'espace réseau de l'API et la joint par la boucle locale.
  seed:
    <<: *answerlineage
    network_mode: "service:api"
    command: ["answerlineage-corpus", "load", "--url", "http://127.0.0.1:8000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
