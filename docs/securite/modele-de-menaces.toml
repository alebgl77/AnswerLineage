code = "api/src/answerlineage_api/lineage/impact.py"
test = "api/tests/test_impact.py::test_reads_beyond_the_bound_give_a_partial_result_that_says_so"

[[threat]]
id = "api/injection-sql"
name = "Une valeur reçue est exécutée comme du SQL"
category = "tampering"
boundary = "emetteur-ingestion"
assets = ["lignage"]
description = "Un nom de jeu de données ou un curseur écrit comme une requête atteindrait la base sous forme d'instruction."
abuse_cases = ["identifiants/jeu-sql"]

[[threat.mitigation]]
