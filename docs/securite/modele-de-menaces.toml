code = "api/src/answerlineage_api/store/graph.py"
test = "api/tests/test_graph_store.py::test_a_backdated_event_widens_the_read_instead_of_moving_it"

[[threat]]
id = "api/fichier-hors-explorateur"
name = "L'API sert un fichier hors de l'explorateur construit"
category = "information-disclosure"
boundary = "lecteur-lecture"
assets = ["hote"]
description = "Un chemin piégé (« .. », encodage, lien) ferait servir par l'API un fichier du serveur qui n'appartient pas à l'explorateur."

[[threat.mitigation]]
description = "Rien n'est servi hors des fichiers construits."
code = "api/src/answerlineage_api/explorer.py"
test = "api/tests/test_explorer_files.py::test_nothing_outside_the_built_files_is_served"

[[threat]]
id = "api/donnees-au-repos"
name = "Un accès à la base livre ce qu'elle tient"
category = "information-disclosure"
boundary = "donnees-au-repos"
assets = ["lignage", "destinataires"]
