category = "elevation-of-privilege"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une issue, un commentaire ou une merge request portent une instruction qu'un agent de code lancé par le pipeline exécuterait."

[[threat.mitigation]]
description = "Un agent de code lancé sur une entrée non fiable n'a pas de droit d'écriture."
