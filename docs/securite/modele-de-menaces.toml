test = "workers/tests/test_destination.py::test_a_name_that_leads_to_a_forbidden_address_is_refused_at_startup"

[[threat.mitigation]]
description = "Chaque connexion résout le nom, contrôle chaque adresse et se fait à l'adresse contrôlée : une seconde résolution ne mène pas ailleurs."
code = "workers/src/answerlineage_workers/destination.py::addresses_of"
test = "workers/tests/test_destination.py::test_each_connection_checks_what_the_name_leads_to_and_goes_there"

[threat.acceptance]
reason = "Les adresses internes autres que les métadonnées et le lien local sont admises : le catalogue d'une entreprise est souvent sur son réseau privé, et l'adresse ne vient que de l'exploitant."
consequence = "Un exploitant qui règle par erreur l'adresse d'un service interne y envoie les événements projetés, sans contenu ; le contrôle ne le distingue pas d'un catalogue."

[[threat]]
