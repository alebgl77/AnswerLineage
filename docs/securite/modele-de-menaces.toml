test = "workers/tests/test_reemission.py::test_neither_the_journal_nor_the_base_keep_the_address_the_header_or_any_content"

[[threat.mitigation]]
description = "Seul part ce que la projection a intégré au graphe, tel qu'il a été accepté : ni un événement refusé, ni un doublon, ni un événement au rebut."
