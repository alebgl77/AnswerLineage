[[threat.mitigation]]
description = "L'écriture du graphe est idempotente et commutative."
code = "api/src/answerlineage_api/store/graph.py"
test = "tests/test_idempotent_ingestion.py::test_arrival_order_and_replays_do_not_change_the_graph"

[[threat.mitigation]]
