test = "tests/test_graph_rebuild.py::test_the_synthetic_enterprise_is_rebuilt_identical_from_its_raw_events"

[[threat.mitigation]]
description = "Interrompue, la reconstruction laisse son point de reprise dans la base : la suivante la reprend sans vider le graphe de nouveau, et les workers projettent ce qui reste."
code = "workers/src/answerlineage_workers/rebuild.py::rebuild_graph"
test = "workers/tests/test_rebuild.py::test_an_interrupted_rebuild_resumes_without_emptying_the_graph_again"

