description = "Les événements bruts se rejouent : un événement reçu sous une règle plus lâche porterait, à sa projection, un nom que l'ingestion refuse aujourd'hui."

[[threat.mitigation]]
description = "La projection contrôle à nouveau chaque identifiant."
code = "workers/src/answerlineage_workers/projection.py"
test = "workers/tests/test_projection.py::test_identifiers_of_an_event_stored_before_validation_never_reach_the_graph"

[[threat]]
id = "workers/analyse-epuisante"
name = "L'analyse d'un incident déclaré épuise les workers"
category = "denial-of-service"
boundary = "lecteur-lecture"
assets = ["disponibilite"]
description = "Un incident sur un jeu lu partout, ou des déclarations en rafale, occuperaient les workers sans fin."

[[threat.mitigation]]
description = "Une analyse au-delà de son délai est remise à plus tard, puis abandonnée."
code = "workers/src/answerlineage_workers/incidents.py"
test = "workers/tests/test_incidents.py::test_an_analysis_beyond_its_deadline_is_postponed_as_a_timeout"

[[threat.mitigation]]
description = "Un résultat au-delà de ses bornes dit qu'il est tronqué."
code = "workers/src/answerlineage_workers/incidents.py"
test = "workers/tests/test_incidents.py::test_a_result_beyond_its_bounds_says_it_is_truncated"

[[threat]]
id = "workers/partition-manquante"
name = "Une partition manquante fait refuser l'ingestion"
category = "denial-of-service"
boundary = "donnees-au-repos"
assets = ["disponibilite"]
description = "Sans partition pour le mois qui commence, l'écriture des événements bruts échouerait ; une maintenance bloquée derrière une lecture longue la retarderait."

[[threat.mitigation]]
description = "Une partition future qui manque sept jours avant son mois lève une alerte."
code = "workers/src/answerlineage_workers/partitions.py"
test = "workers/tests/test_partitions.py::test_a_future_partition_missing_seven_days_ahead_raises_one_alert"

[[threat.mitigation]]
description = "La maintenance n'attend jamais une lecture longue."
code = "workers/src/answerlineage_workers/partitions.py"
test = "workers/tests/test_partitions.py::test_a_table_held_by_a_long_reading_is_skipped_without_waiting"

[[threat]]
id = "workers/emetteur-muet"
name = "Un émetteur se tait et le trou de lignage passe inaperçu"
category = "repudiation"
boundary = "emetteur-ingestion"
assets = ["lignage"]
description = "Un proxy arrêté, mal réglé ou coupé de l'API ne publie plus rien : ses appels manqueraient au graphe sans que personne ne le sache."

[[threat.mitigation]]
description = "Un émetteur silencieux plus de dix minutes est signalé."
code = "workers/src/answerlineage_workers/silence.py"
test = "workers/tests/test_silence.py::test_an_emitter_silent_for_more_than_ten_minutes_is_signalled_once"

[[threat]]
id = "workers/reconstruction-destructrice"
name = "Une reconstruction du graphe détruit du lignage qu'elle ne peut pas rendre"
category = "tampering"
boundary = "donnees-au-repos"
assets = ["lignage"]
description = "La reconstruction vide le graphe avant de le rejouer. Lancée par erreur, deux fois à la fois, interrompue, ou alors que la conservation a purgé les événements qui ont fait connaître ses lignes les plus anciennes, elle perdrait du lignage, ou toucherait à ce qui n'est pas du graphe."

[[threat.mitigation]]
description = "Sans confirmation explicite (--yes), la commande ne donne qu'un aperçu : rien ne change."
code = "workers/src/answerlineage_workers/cli.py::rebuild"
test = "workers/tests/test_rebuild.py::test_without_yes_the_command_only_shows_what_it_would_do"

[[threat.mitigation]]
description = "Des lignes du graphe plus anciennes que le premier événement conservé arrêtent la reconstruction, sauf si leur perte est acceptée (--accept-loss) ; refusée, elle ne change rien."
code = "workers/src/answerlineage_workers/rebuild.py::_start"
test = "workers/tests/test_rebuild.py::test_rows_older_than_the_conserved_events_stop_the_rebuild_unless_lost_knowingly"

[[threat.mitigation]]
description = "Une seule reconstruction à la fois : un verrou consultatif fait refuser la seconde."
code = "workers/src/answerlineage_workers/rebuild.py::rebuild_graph"
test = "workers/tests/test_rebuild.py::test_a_second_rebuild_is_refused_while_one_runs"

[[threat.mitigation]]
description = "Seules les tables du graphe sont vidées, et le graphe rejoué est l'original, ligne à ligne, heures comprises ; le rebut garde ses événements et leur motif."
code = "workers/src/answerlineage_workers/rebuild.py::_start"
test = "tests/test_graph_rebuild.py::test_the_synthetic_enterprise_is_rebuilt_identical_from_its_raw_events"

[[threat.mitigation]]
description = "Interrompue, la reconstruction laisse son point de reprise dans la base : la suivante la reprend sans vider le graphe de nouveau, et les workers projettent ce qui reste."
code = "workers/src/answerlineage_workers/rebuild.py::rebuild_graph"
test = "workers/tests/test_rebuild.py::test_an_interrupted_rebuild_resumes_without_emptying_the_graph_again"

[[threat]]
id = "workers/graphe-partiel"
name = "Une analyse ou une lecture conclut sur un graphe en cours de reconstruction"
category = "tampering"
boundary = "lecteur-lecture"
assets = ["lignage"]
description = "Pendant une reconstruction, le graphe ne tient qu'une partie des événements : une analyse d'incident faite à ce moment manquerait des réponses touchées, et rien ne la relancerait ; une lecture de l'API ferait de même."

[[threat.mitigation]]
description = "Les workers ne projettent ni n'analysent tant que la reconstruction tient la barrière du graphe."
code = "workers/src/answerlineage_workers/gate.py::share"
test = "workers/tests/test_rebuild.py::test_workers_stand_aside_while_the_rebuild_projects"

[[threat.mitigation]]
description = "Une analyse attend que la file ait rendu au graphe tout ce qu'une reconstruction inachevée y a mis."
code = "workers/src/answerlineage_workers/incidents.py::process_analysis"
test = "workers/tests/test_rebuild.py::test_an_analysis_waits_until_the_rebuild_has_given_the_graph_back"

[threat.acceptance]
reason = "La reconstruction ne bloque pas les lectures de l'API, pour qu'elle reste disponible : un événement est à tout instant dans la file ou dans le graphe, et la couverture du lignage compte comme trous les appels d'outil encore en file."
consequence = "Pendant une reconstruction, une lecture voit un graphe partiel : une réponse dont l'événement d'agent attend encore dans la file manque sans que la couverture le dise."

