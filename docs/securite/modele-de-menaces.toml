test = "workers/tests/test_webhooks.py::test_a_refused_webhook_stops_the_worker_at_startup_without_citing_its_address_or_secret"

[[threat.mitigation]]
description = "Le journal et la base ne gardent que des nombres, des statuts et des classes d'erreur : ni le secret, ni l'adresse, ni rien d'un message ; le secret n'est jamais affiché."
code = "workers/src/answerlineage_workers/webhooks.py::run_webhooks"
test = "workers/tests/test_webhooks.py::test_neither_the_journal_nor_the_base_keep_the_address_the_secret_or_any_content"

[[threat.mitigation]]
description = "Le message suit un gabarit fixe, publié et fermé : des identifiants, des codes de listes fermées, des heures et des nombres ; les destinataires sont comptés, jamais nommés."
code = "workers/src/answerlineage_workers/webhooks.py::message"
test = "workers/tests/test_webhooks.py::test_the_message_follows_the_published_format_signed_without_any_content"

[[threat.mitigation]]
description = "Le récepteur obéit aux règles d'adresse de la réémission : https, ou http sur la boucle locale seulement, TLS vérifié, certificat et nom."
code = "workers/src/answerlineage_workers/destination.py::tls_context"
test = "workers/tests/test_destination.py::test_tls_is_verified_and_an_internal_authority_is_trusted_through_the_system_setting"

[[threat]]
id = "workers/webhook-file-epuisante"
name = "Un récepteur en panne ou un afflux d'incidents fait grossir la file des webhooks ou retarde les workers"
category = "denial-of-service"
boundary = "workers-recepteur"
assets = ["disponibilite", "annonces-d-incident"]
description = "Un récepteur arrêté, lent ou qui répond goutte à goutte retiendrait l'envoi ; un appelant de l'API, qui n'est pas authentifié, déclarerait des incidents en nombre : la file grossirait dans la base, la projection et l'analyse attendraient le récepteur, des workers revenant tous ensemble l'empêcheraient de se relever, et deux workers enverraient deux fois le même message."

[[threat.mitigation]]
description = "Sans webhook en service, rien n'est mis en file ; un changement d'état annulé n'y met rien."
code = "api/src/answerlineage_api/incidents/webhooks.py::announce"
test = "workers/tests/test_webhooks.py::test_without_a_webhook_in_service_no_change_of_state_is_queued"

[[threat.mitigation]]
description = "La file est bornée en âge et en nombre : ce qui déborde, les plus anciens d'abord, est retiré, compté perdu et dit au journal."
code = "workers/src/answerlineage_workers/webhooks.py::trim"
test = "workers/tests/test_webhooks.py::test_the_overflow_of_the_queue_is_counted_and_said"

[[threat.mitigation]]
description = "L'envoi tourne dans une boucle à part, ses entrées-sorties dans un fil à part, sous un délai total : un récepteur qui ne répond pas ne retarde ni la projection ni l'analyse, et l'arrêt coupe l'envoi en cours."
code = "workers/src/answerlineage_workers/queue.py::run_worker"
test = "workers/tests/test_webhooks.py::test_a_receiver_that_does_not_answer_slows_neither_the_projection_nor_the_analysis"

[[threat.mitigation]]
description = "Une panne arrête le lot au premier échec ; la reprise attend de plus en plus, jusqu'à un plafond, tirée au hasard ; rien ne se perd quand le récepteur revient."
code = "workers/src/answerlineage_workers/webhooks.py::run_webhooks"
test = "workers/tests/test_webhooks.py::test_a_receiver_down_then_back_loses_nothing_and_keeps_the_delivery_id"

[[threat.mitigation]]
description = "Deux workers réclament leurs lots avec FOR UPDATE SKIP LOCKED : jamais deux fois le même message."
code = "workers/src/answerlineage_workers/webhooks.py::deliver_batch"
test = "workers/tests/test_webhooks.py::test_two_workers_never_send_a_message_twice"

[[threat]]
id = "workers/webhook-detourne"
name = "L'adresse du récepteur des webhooks est détournée vers une autre adresse"
category = "elevation-of-privilege"
boundary = "workers-recepteur"
assets = ["hote", "secret-des-webhooks"]
description = "Si un incident, une réponse ou une redirection choisissait l'adresse, le webhook deviendrait une requête sortante au service d'un tiers, depuis le réseau des workers : vers le service de métadonnées d'un cloud, qui sert les identifiants de la machine, ou vers un service interne, signée sous le secret partagé."

[[threat.mitigation]]
description = "L'adresse est réglée par l'exploitant au démarrage et contrôlée par les règles de la réémission ; une adresse interdite empêche le worker de démarrer, sans être citée."
code = "workers/src/answerlineage_workers/cli.py::webhook_from"
test = "workers/tests/test_webhooks.py::test_a_refused_webhook_stops_the_worker_at_startup_without_citing_its_address_or_secret"

[[threat.mitigation]]
description = "Aucune redirection n'est suivie : une réponse 3xx est un échec, le message reste en file."
code = "workers/src/answerlineage_workers/destination.py::Sender"
test = "workers/tests/test_destination.py::test_a_redirect_is_not_followed"

[[threat.mitigation]]
description = "Chaque connexion résout le nom, contrôle chaque adresse et se fait à l'adresse contrôlée : une seconde résolution ne mène pas ailleurs."
code = "workers/src/answerlineage_workers/destination.py::addresses_of"
test = "workers/tests/test_destination.py::test_each_connection_checks_what_the_name_leads_to_and_goes_there"

[threat.acceptance]
reason = "Comme pour la réémission, les adresses internes autres que les métadonnées et le lien local sont admises : le récepteur d'une entreprise est souvent sur son réseau privé, et l'adresse ne vient que de l'exploitant."
consequence = "Un exploitant qui règle par erreur l'adresse d'un service interne y envoie les annonces d'incident, signées, sans contenu ; le contrôle ne le distingue pas d'un récepteur."

[[threat]]
id = "workers/assertion-texte-libre"
name = "Le texte libre d'une assertion de qualité gagne la base, l'API, le journal ou un message"
category = "information-disclosure"
boundary = "emetteur-ingestion"
assets = ["contenus", "destinataires"]
description = "Une assertion de la facette dataQualityAssertions porte du texte libre : son nom, sa description, son corps SQL avec ses littéraux, les valeurs attendue et observée, qui peuvent citer une donnée d'un client, ses paramètres. Recopié, il entrerait dans la base, les réponses de l'API, le journal des workers, et de là dans un message ou un modèle. L'événement brut, archivé tel qu'il a été reçu comme tout événement, le garde."
abuse_cases = ["champs/assertion-nom-texte-libre", "champs/assertion-description-texte-libre", "champs/assertion-corps-sql", "champs/assertion-type-de-corps", "champs/assertion-valeur-attendue", "champs/assertion-valeur-observee", "champs/assertion-parametres", "identifiants/assertion-colonne-piegee", "identifiants/assertion-classe-piegee", "identifiants/assertion-gravite-piegee"]

[[threat.mitigation]]
description = "L'extraction ne lit que la réussite, la classe, la gravité et la colonne d'une assertion : la classe et la gravité sont ramenées à des listes fermées, la colonne est contrôlée comme un nom, sinon l'échec porte sur la table."
code = "workers/src/answerlineage_workers/quality.py::assess"
test = "workers/tests/test_quality.py::test_no_free_text_of_an_assertion_is_ever_read"

[[threat.mitigation]]
description = "Un canari dans chaque champ libre, la colonne, la classe ou la gravité d'une assertion ne se retrouve ni dans la base hors de l'archive des événements, ni dans la réponse, ni au journal."
code = "workers/src/answerlineage_workers/quality.py::record"
test = "tests/test_abuse_corpus.py::test_every_case_of_the_abuse_corpus_is_blocked"

[[threat]]
id = "workers/propositions-inondees"
name = "Un émetteur inonde les workers de tests en échec et masque les vraies propositions"
category = "denial-of-service"
boundary = "emetteur-ingestion"
assets = ["disponibilite", "lignage"]
description = "L'ingestion n'authentifie pas les émetteurs : un tiers envoie des événements de test aux assertions sans nombre, sur des colonnes et des jeux sans nombre, ou vieux d'années. Les lots grossiraient, la base se remplirait de signaux, et les propositions ouvertes masqueraient les vraies."
abuse_cases = ["lots/assertions-en-rafale"]

[[threat.mitigation]]
description = "1 000 assertions lues par jeu, 10 000 par événement, 1 000 colonnes relevées par événement, 100 000 signaux en attente, 100 000 colonnes suivies : le reste est compté, jamais cité."
code = "workers/src/answerlineage_workers/quality.py::assess"
test = "workers/tests/test_quality.py::test_beyond_its_bound_an_event_keeps_its_failures_first_and_counts_the_rest"

[[threat.mitigation]]
description = "Au-delà de 100 propositions ouvertes, un signal est refusé, compté et dit une fois par épisode ; une proposition existante s'enrichit encore, sous sa borne de 100 colonnes."
code = "workers/src/answerlineage_workers/proposals.py::process_signals"
test = "workers/tests/test_proposals.py::test_beyond_the_bound_of_open_proposals_a_signal_is_refused_and_said_once"

[[threat.mitigation]]
description = "Un événement reçu ou daté de plus de 31 jours ne propose rien : un vieil événement rejoué ne fait pas naître de proposition."
code = "workers/src/answerlineage_workers/quality.py::record"
test = "workers/tests/test_proposals.py::test_an_old_failure_proposes_nothing"

[threat.acceptance]
reason = "Les émetteurs ne sont pas authentifiés, et une borne par émetteur se contournerait en changeant d'espace de noms : seule la borne globale des propositions ouvertes tient la table et la liste."
consequence = "Un émetteur hostile peut remplir les 100 propositions ouvertes et faire refuser les signaux des vrais tests en échec, jusqu'à ce que des propositions soient décidées ; le refus se compte et se dit au journal."

