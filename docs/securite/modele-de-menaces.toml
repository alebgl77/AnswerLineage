[[threat.mitigation]]
description = "En clair, la boucle locale seulement ; ni identifiant, ni paramètre, ni fragment dans l'adresse, ni adresse de métadonnées ou de lien local, écrite ou enveloppée ; un refus ne cite ni l'adresse ni l'en-tête."
