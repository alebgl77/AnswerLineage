[[threat]]
id = "cli/redirection"
name = "Une redirection emmène la commande vers une autre adresse"
category = "information-disclosure"
boundary = "lecteur-lecture"
assets = ["hote", "lignage"]
description = "Une API piégée renvoie la commande vers une adresse de son choix, qui recevrait la requête et ses paramètres."

[[threat.mitigation]]
description = "Une redirection n'est jamais suivie."
code = "cli/src/answerlineage_cli/client.py"
test = "cli/tests/test_hostile.py::test_a_redirect_is_not_followed"

[[threat]]
id = "cli/journal"
name = "La bibliothèque HTTP journalise les requêtes et les réponses de la commande"
category = "information-disclosure"
boundary = "lecteur-lecture"
assets = ["lignage"]
description = "httpx écrit l'adresse complète des requêtes dans son journal : les noms de jeux de données et les identifiants de réponses y passeraient."

[[threat.mitigation]]
description = "Les journaux du transport sont coupés : ni requête ni réponse n'atteint un journal."
code = "cli/src/answerlineage_cli/client.py::quiet_transport_logs"
test = "cli/tests/test_logs.py::test_neither_the_request_nor_the_response_reaches_a_log"

[[threat]]
id = "cli/adresse-avec-secret"
name = "Une adresse d'API porteuse d'un secret est recopiée ou suivie"
category = "information-disclosure"
boundary = "lecteur-lecture"
assets = ["hote"]
description = "Une adresse donnée en option ou dans l'environnement porte un mot de passe, un jeton en paramètre ou un autre schéma que HTTP ; un message d'erreur la recopierait."

[[threat.mitigation]]
description = "Une adresse refusée est une erreur d'usage qui ne la cite pas, et rien n'est envoyé."
code = "cli/src/answerlineage_cli/client.py::api_base"
test = "cli/tests/test_address.py::test_a_refused_address_is_a_usage_error_that_does_not_cite_it"

# Entreprise synthétique, corpus de vérité et corpus d'abus

[[threat]]
id = "corpus/corpus-d-abus-affaibli"
name = "Le corpus d'abus est affaibli pour laisser passer une régression"
category = "tampering"
boundary = "pipeline-publication"
assets = ["mesures"]
description = "Une merge request retire un cas, change son verdict attendu ou le déclare ouvert : la régression qu'il aurait vue passe la porte."

[[threat.mitigation]]
description = "Chaque famille exigée garde au moins trois cas bloqués."
code = "corpus/src/answerlineage_corpus/abuse.py"
test = "corpus/tests/test_abuse.py::test_a_family_with_fewer_than_three_blocked_cases_fails_the_check"

[[threat.mitigation]]
description = "L'empreinte du corpus est liée à sa version : un contenu changé sans nouvelle version échoue."
code = "corpus/src/answerlineage_corpus/abuse.py"
test = "corpus/tests/test_abuse.py::test_a_content_that_changes_without_a_new_version_fails_the_check"

[[threat.mitigation]]
description = "Ouvrir un cas modifie un chemin protégé, qui demande la revue du mainteneur."
code = "scripts/check_agent_config.py"
test = "tests/test_agent_config.py::test_agent_configuration_and_guardrails_are_protected"

[[threat]]
id = "corpus/verite-faussee"
name = "La vérité qui mesure le moteur est faussée"
category = "tampering"
boundary = "pipeline-publication"
assets = ["mesures"]
description = "Calculée avec le moteur qu'elle mesure, ou réécrite à la main pour suivre un moteur affaibli, la vérité ne verrait plus une réponse manquée."

[[threat.mitigation]]
description = "La vérité de l'entreprise synthétique s'établit à partir de ce qu'elle a généré, sans le moteur."
code = "corpus/src/answerlineage_corpus/enterprise.py"
test = "corpus/tests/test_enterprise.py::test_truth_of_an_incident_is_the_exact_list_of_touched_answers"

[[threat.mitigation]]
description = "Un moteur affaibli échoue à la porte de qualité, qui nomme les réponses manquées."
code = "corpus/src/answerlineage_corpus/measure.py"
test = "tests/test_truth_corpus_impact.py::test_a_weakened_engine_fails_the_gate_which_names_the_missed_answers"

[[threat.mitigation]]
description = "La vérité d'un scénario est recoupée avec sa description."
code = "corpus/src/answerlineage_corpus/scenarios.py"
test = "corpus/tests/test_scenarios.py::test_a_truth_the_scenario_contradicts_fails_the_check"

[[threat]]
id = "corpus/donnees-reelles"
name = "Le corpus porte des noms de personnes ou des contenus"
category = "information-disclosure"
boundary = "pipeline-publication"
assets = ["destinataires", "contenus"]
description = "L'entreprise synthétique et les scénarios sont publiés avec le dépôt et chargés dans la démonstration : un nom de personne ou un contenu y serait divulgué."

[[threat.mitigation]]
description = "Les destinataires de l'entreprise synthétique sont des pseudonymes."
code = "corpus/src/answerlineage_corpus/enterprise.py"
test = "corpus/tests/test_enterprise.py::test_recipients_are_pseudonyms_never_names"

[[threat.mitigation]]
description = "La vérité est publiée sans aucun contenu."
code = "corpus/src/answerlineage_corpus/truth.py"
test = "corpus/tests/test_enterprise.py::test_truth_is_published_without_any_content"

[[threat.mitigation]]
description = "Les scénarios portent des pseudonymes et des empreintes, jamais des noms."
code = "corpus/src/answerlineage_corpus/scenarios.py"
test = "corpus/tests/test_scenarios.py::test_scenarios_carry_pseudonyms_and_fingerprints_never_names"

# Kit de conformité

[[threat]]
id = "conformance/fuite-non-vue"
name = "Un émetteur qui fuit du contenu passe le kit"
category = "information-disclosure"
boundary = "emetteur-ingestion"
assets = ["contenus", "mesures"]
description = "Un contenu encodé (base64, hexadécimal, UTF-16), tronqué ou changé de casse échapperait à une recherche littérale ; un parcours sans canari serait vert sans avoir rien jugé."

[[threat.mitigation]]
description = "Un résultat d'outil en base64 dans un journal est trouvé."
code = "conformance/src/answerlineage_conformance/content.py"
test = "conformance/tests/test_content.py::test_a_tool_result_in_base64_in_a_log_is_caught"

[[threat.mitigation]]
description = "Un canari tronqué est trouvé par son seul tirage."
code = "conformance/src/answerlineage_conformance/canaries.py"
test = "conformance/tests/test_content.py::test_a_truncated_canary_is_caught_by_its_draw_alone"

[[threat.mitigation]]
description = "Un témoin sans canari fait échouer le jugement : un parcours vide serait vert."
code = "conformance/src/answerlineage_conformance/content.py"
test = "conformance/tests/test_content.py::test_a_witness_without_a_canary_fails_because_an_empty_run_would_be_green"

[[threat]]
id = "conformance/rapport-qui-fuit"
name = "Le rapport du kit recopie le contenu qu'il a trouvé"
category = "information-disclosure"
boundary = "emetteur-ingestion"
assets = ["contenus"]
description = "Un rapport qui cite la fuite la publierait une seconde fois, dans la sortie du pipeline de l'intégrateur."

[[threat.mitigation]]
description = "Le rapport, en texte comme en JSON, situe une fuite sans jamais citer le canari."
code = "conformance/src/answerlineage_conformance/report.py"
test = "conformance/tests/test_content.py::test_the_report_of_a_leak_never_quotes_the_canary"

[[threat]]
id = "conformance/fichier-hostile"
name = "Un fichier jugé épuise le kit ou piège son terminal"
category = "denial-of-service"
boundary = "emetteur-ingestion"
assets = ["hote"]
description = "Les fichiers qu'on donne au kit viennent de l'émetteur jugé : démesurés, imbriqués sans fin, ou nommés pour piéger le terminal."

[[threat.mitigation]]
description = "Un fichier au-delà de sa taille limite est refusé."
code = "conformance/src/answerlineage_conformance/cli.py"
test = "conformance/tests/test_cli.py::test_a_file_beyond_the_size_limit_exits_with_two"

[[threat.mitigation]]
description = "Des événements trop imbriqués pour être jugés sont refusés."
code = "conformance/src/answerlineage_conformance/cli.py"
test = "conformance/tests/test_cli.py::test_events_too_deeply_nested_to_be_judged_exit_with_two"

[[threat.mitigation]]
description = "Un nom de fichier qui n'est pas anodin n'est jamais affiché."
code = "conformance/src/answerlineage_conformance/cli.py"
test = "conformance/tests/test_cli.py::test_a_file_name_that_is_not_plain_is_never_printed"

[[threat]]
id = "conformance/schema-substitue"
name = "Le kit juge contre un schéma substitué"
category = "tampering"
boundary = "pipeline-publication"
assets = ["mesures"]
description = "Un schéma résolu par le réseau pourrait être remplacé en chemin, et le kit jugerait conforme un événement qui ne l'est pas."

[[threat.mitigation]]
description = "Chaque référence au schéma d'OpenLineage se résout sans le réseau."
code = "conformance/src/answerlineage_conformance/schemas.py"
test = "conformance/tests/test_schemas.py::test_every_reference_to_openlineage_is_resolved_without_the_network"

[[threat.mitigation]]
description = "Les schémas embarqués sont, à l'octet près, ceux que publie le dépôt."
code = "conformance/src/answerlineage_conformance/schemas.py"
test = "conformance/tests/test_schemas.py::test_the_embedded_schemas_are_the_published_ones_to_the_byte"

[[threat]]
id = "conformance/resume-a2a-mensonger"
name = "Un agent appelé en A2A déclare des lectures fausses dans son résumé"
category = "spoofing"
boundary = "emetteur-ingestion"
assets = ["lignage"]
description = "Le résumé de lignage qu'un agent appelé rend à son appelant n'est pas signé : l'appelé peut taire une lecture, en inventer, ou y glisser du contenu."

[[threat.mitigation]]
description = "Le kit nomme un contenu glissé dans un champ du résumé."
code = "conformance/src/answerlineage_conformance/a2a.py"
test = "conformance/tests/test_a2a.py::test_content_in_a_field_of_the_summary_is_named"

[[threat.mitigation]]
description = "Le kit nomme un résumé aux jeux de données trop nombreux."
code = "conformance/src/answerlineage_conformance/a2a.py"
test = "conformance/tests/test_a2a.py::test_a_summary_with_too_many_datasets_is_named"

[threat.acceptance]
reason = "Le résumé A2A n'est pas signé dans la version 1 de l'extension, et aucun adaptateur A2A n'est encore fourni : le lignage d'un agent appelé se prend sur sa parole."
consequence = "Une lecture tue par un agent appelé manque au lignage de son appelant : une réponse qui en dépend n'est pas rappelée."

# Explorateur

[[threat]]
id = "ui/script-injecte"
name = "Un nom venu d'un émetteur exécute un script dans l'explorateur"
category = "elevation-of-privilege"
boundary = "lecteur-lecture"
assets = ["lignage"]
description = "Un nom de jeu de données ou d'outil écrit comme une balise, affiché dans le graphe, exécuterait un script dans la page du lecteur, qui pourrait alors lire le lignage ou déclarer des incidents."
abuse_cases = ["identifiants/jeu-balise", "identifiants/jeu-balise-pleine-chasse"]

[[threat.mitigation]]
description = "Politique de sécurité du contenu stricte : ni script ni style en ligne, aucune ressource d'ailleurs."
code = "api/src/answerlineage_api/headers.py"
test = "api/tests/test_explorer_files.py::test_the_content_policy_allows_nothing_inline_and_nothing_from_elsewhere"

[[threat.mitigation]]
description = "Un nom qui porte une balise est refusé à l'ingestion : il n'atteint pas le graphe."
code = "api/src/answerlineage_api/identifiers.py"
test = "api/tests/test_identifiers.py::test_one_faulty_character_anywhere_is_enough_to_refuse"

[[threat]]
id = "ui/adresse-piegee"
name = "Une adresse partagée piégée fait agir l'explorateur"
category = "tampering"
boundary = "lecteur-lecture"
assets = ["lignage"]
description = "L'adresse est l'état de la page : un lien reçu peut porter une balise, un caractère nul ou un identifiant forgé, pour faire afficher un texte ou appeler une autre route."
abuse_cases = ["identifiants/adresse-balise-propager", "identifiants/adresse-balise-donnees", "invisibles/adresse-caractere-nul"]

[[threat.mitigation]]
description = "Une adresse hostile laisse l'explorateur inerte : aucun nœud, aucun élément né d'elle, un message fixe."
code = "ui/src/route.ts::parseRoute"
test = "tests/test_abuse_explorer.py::test_every_hostile_address_of_the_abuse_corpus_leaves_the_explorer_inert"

[[threat.mitigation]]
description = "Une adresse de remontée hostile ou inconnue donne un message fixe."
code = "ui/src/route.ts::parseRoute"
test = "tests/test_explorer.py::test_a_hostile_or_unknown_trace_address_gives_a_fixed_message"

[[threat]]
id = "ui/cadre-detourne"
name = "Une page tierce encadre l'explorateur pour détourner ses clics"
category = "tampering"
boundary = "lecteur-lecture"
assets = ["lignage"]
description = "Dans un cadre invisible, l'explorateur recevrait des clics que le lecteur croit donner à une autre page."

[[threat.mitigation]]
description = "Toute réponse porte les en-têtes de sécurité, dont frame-ancestors 'none'."
code = "api/src/answerlineage_api/headers.py"
test = "api/tests/test_explorer_files.py::test_every_response_carries_the_security_headers"

# Pipeline et publication

[[threat]]
id = "pipeline/action-deplacee"
name = "Une action ou une image tierce change sous la même étiquette"
category = "tampering"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une étiquette d'action ou d'image se déplace : le pipeline exécuterait un code que personne n'a relu."

[[threat.mitigation]]
description = "Une action se référence par empreinte de commit."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_action_referenced_by_tag_or_branch_fails"

[[threat.mitigation]]
description = "Une image se référence par empreinte sha256, dans un workflow, un script, un Dockerfile ou un fichier compose."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_container_images_must_be_pinned_by_digest"

[[threat.mitigation]]
description = "Le pipeline GitLab épingle aussi ses images par empreinte, où qu'il les nomme, et tient dans un seul fichier : aucun fichier inclus ni pipeline déclenché n'échappe au contrôle."
code = "scripts/check_policy.py::check_gitlab_ci"
test = "tests/test_policy.py::test_gitlab_images_must_be_pinned_by_digest"

[[threat]]
id = "pipeline/merge-request-privilegiee"
name = "Le code d'une merge request obtient un droit d'écriture ou un secret"
category = "elevation-of-privilege"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "pull_request_target, un jeton gardé par actions/checkout ou une écriture accordée à tout le workflow donneraient au code proposé de quoi écrire dans le dépôt ou publier."

[[threat.mitigation]]
description = "pull_request_target est interdit."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_pull_request_target_is_forbidden"

[[threat.mitigation]]
description = "actions/checkout ne garde pas le jeton du pipeline."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_checkout_must_not_keep_the_pipeline_token"

[[threat.mitigation]]
description = "Aucune écriture n'est accordée à tout un workflow."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_write_permission_for_the_whole_workflow_fails"

[[threat]]
id = "pipeline/agent-de-code-piege"
name = "Un agent de code suit une instruction piégée avec un secret ou un droit d'écriture"
category = "elevation-of-privilege"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une issue, un commentaire ou une merge request portent une instruction qu'un agent de code lancé par le pipeline exécuterait."

[[threat.mitigation]]
description = "Un agent de code lancé sur une entrée non fiable n'a pas de droit d'écriture."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_code_agent_on_untrusted_input_must_not_write"

[[threat.mitigation]]
description = "Un agent de code lancé sur une entrée non fiable ne reçoit pas de secret."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_code_agent_on_untrusted_input_must_not_receive_a_secret"

[[threat]]
id = "pipeline/garde-fou-modifie"
name = "Une merge request affaiblit un garde-fou sans revue du mainteneur"
category = "elevation-of-privilege"
boundary = "pipeline-publication"
assets = ["artefacts-publies", "mesures"]
description = "Workflows, scripts de contrôle, propriétaires du code, configuration d'agents, exceptions des analyses et du corpus d'abus, ce modèle : les modifier changerait ce que la porte vérifie."

[[threat.mitigation]]
description = "Une merge request qui modifie un chemin protégé échoue tant que le mainteneur ne l'a pas approuvée."
code = "scripts/check_agent_config.py"
test = "tests/test_agent_config.py::test_merge_request_touching_a_hook_fails_until_a_maintainer_approves"

[[threat.mitigation]]
description = "Chaque chemin protégé a un propriétaire dans CODEOWNERS."
code = "scripts/check_policy.py::check_codeowners"
test = "tests/test_policy.py::test_every_protected_path_needs_a_code_owner"

[[threat.mitigation]]
description = "Sur GitLab, le même contrôle lit les labels de la merge request dans les variables prédéfinies du pipeline."
code = "scripts/check_agent_config.py::read_merge_request"
test = "tests/test_agent_config.py::test_gitlab_pipeline_check_fails_without_the_label_and_passes_with_it"

[[threat]]
id = "pipeline/reglages-du-depot"
name = "Une protection du dépôt manque : une étiquette, une fusion ou un label viennent d'un autre que le mainteneur"
category = "elevation-of-privilege"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "La protection de main, la revue exigée des propriétaires du code, le label agent-config-approved et la protection des étiquettes v* sont des réglages du dépôt : sans eux, quiconque pousse une étiquette publie une version valablement signée, et un garde-fou se modifie sans revue."

[threat.acceptance]
reason = "Ces réglages ne se versionnent pas : aucun contrôle du dépôt ne peut les vérifier. Ils sont listés pour le mainteneur dans la documentation du pipeline et de la publication."
consequence = "Si l'un d'eux manque, les artefacts restent signés et attestés, mais par une identité qu'un tiers a pu mettre en mouvement."

[[threat]]
id = "pipeline/secret-dans-l-historique"
name = "Un secret entre dans l'historique public"
category = "information-disclosure"
boundary = "pipeline-publication"
assets = ["hote", "artefacts-publies"]
description = "Un jeton, une clé ou un mot de passe commité, même retiré ensuite, reste lisible dans l'historique d'un dépôt public."

[[threat.mitigation]]
description = "Gitleaks analyse tout l'historique à chaque merge request, après un canari qui prouve qu'il bloque."
code = "scripts/gitleaks.sh::scan"
test = "scripts/gitleaks.sh::selftest"

[[threat]]
id = "pipeline/image-vulnerable"
name = "Une image est publiée avec une vulnérabilité haute ou critique connue"
category = "tampering"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une dépendance ou un paquet de l'image de base porte une vulnérabilité connue au jour de la publication."

[[threat.mitigation]]
description = "Une vulnérabilité haute ou critique sans exception valable bloque."
code = "scripts/check_vulnerabilities.py"
test = "tests/test_vulnerabilities.py::test_high_and_critical_findings_without_exception_block"

[[threat.mitigation]]
description = "Une exception sans motif, ou dont la revue est passée, ne s'applique plus."
code = "scripts/check_vulnerabilities.py"
test = "tests/test_vulnerabilities.py::test_an_exception_without_reason_or_with_a_lapsed_review_is_refused"

[[threat]]
id = "pipeline/artefact-contrefait"
name = "Un artefact contrefait passe pour une version du projet"
category = "spoofing"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une image ou un paquet poussé par un tiers, ou avec un jeton de publication volé, sous le nom du projet."

[[threat.mitigation]]
description = "Un job qui publie ne reçoit aucun secret : il publie par l'identité OIDC du workflow."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_a_job_that_publishes_receives_no_secret"

[[threat.mitigation]]
description = "Les paquets partent sur PyPI par publication de confiance, sans jeton."
code = "scripts/check_policy.py"
test = "tests/test_policy.py::test_a_pypi_upload_uses_trusted_publishing_rather_than_a_token"

[[threat.mitigation]]
description = "L'image est signée sans clé par son empreinte ; la signature est éprouvée à chaque merge request, et une image modifiée ne passe pas."
code = "scripts/image.sh::sign"
test = "scripts/image.sh::signtest"

[[threat]]
id = "pipeline/version-incoherente"
name = "Une version publiée installe des composants d'une autre version"
category = "tampering"
boundary = "pipeline-publication"
assets = ["artefacts-publies"]
description = "Une étiquette qui n'est pas la version déclarée, ou un composant qui n'épingle pas ses frères, ferait installer ensemble des paquets qui n'ont pas été éprouvés ensemble."

[[threat.mitigation]]
description = "Une étiquette d'une autre version que celle des paquets est refusée."
code = "scripts/check_release.py"
test = "tests/test_release.py::test_a_tag_of_another_version_is_refused"

[[threat.mitigation]]
description = "Un composant épingle ses frères à sa version exacte."
code = "scripts/check_release.py"
test = "tests/test_release.py::test_a_sibling_must_be_pinned_to_the_same_version"

[[threat]]
id = "pipeline/nom-usurpe"
name = "Un tiers publie sous un nom du projet sur PyPI ou npm"
category = "spoofing"
boundary = "pipeline-publication"
assets = ["artefacts-publies", "hote"]
description = "Un nom que la documentation cite sans qu'il soit réservé, ou réservé trop tard, ferait installer le paquet d'un tiers."

[[threat.mitigation]]
description = "La documentation ne cite que les noms que le projet publie ou se réserve."
code = "scripts/check_release.py::distribution_names"
test = "tests/test_documentation.py::test_the_documentation_cites_only_the_published_distribution_names"

[threat.acceptance]
reason = "PyPI et npm ne réservent un nom qu'à sa première publication : le mainteneur réserve ceux du projet avant la première étiquette, comme le dit le guide de publication."
consequence = "Tant qu'un nom n'est pas réservé, un tiers peut le prendre, et qui installe le projet sous ce nom installe son paquet."

[[threat]]
id = "pipeline/dependance-compromise"
name = "Une dépendance compromise entre au verrou, dans l'image ou dans l'explorateur"
category = "tampering"
boundary = "pipeline-publication"
assets = ["artefacts-publies", "hote"]
description = "Une version malveillante d'une dépendance Python ou npm s'exécute à l'installation sur le poste ou dans le pipeline, puis entre dans l'image et les paquets publiés."

[threat.acceptance]
reason = "Les dépendances sont verrouillées, attendent sept jours avant d'être adoptées (exclude-newer, minimumReleaseAge), et l'explorateur s'installe sans exécuter de script ; aucun test ne prouve ces parades, et une version malveillante plus ancienne que le délai passe."
consequence = "Une dépendance compromise depuis plus de sept jours entre au verrou à la mise à jour suivante, puis dans l'image et les paquets ; l'analyse des vulnérabilités ne voit que ce qui est déjà connu."

[[threat]]
id = "pipeline/conteneur-de-developpement"
name = "Le conteneur de développement expose les identifiants de l'hôte"
category = "information-disclosure"
boundary = "pipeline-publication"
assets = ["hote"]
description = "Un montage du dossier SSH, des identifiants d'un nuage ou du socket Docker, ou un jeton transmis, livrerait les identifiants du poste au code du dépôt et à ses dépendances."

[[threat.mitigation]]
description = "Le conteneur ne monte aucun emplacement d'identifiants."
code = "scripts/check_policy.py::check_devcontainer"
test = "tests/test_policy.py::test_development_container_must_not_mount_host_credentials"

[[threat.mitigation]]
description = "Le conteneur ne reçoit aucun jeton de l'hôte."
code = "scripts/check_policy.py::check_devcontainer"
test = "tests/test_policy.py::test_development_container_must_not_receive_host_tokens"

[[threat]]
id = "pipeline/modele-perime"
name = "Un composant ou une version sort sans que ses menaces aient été revues"
category = "repudiation"
boundary = "pipeline-publication"
assets = ["artefacts-publies", "mesures"]
description = "Un composant fusionné hors du modèle, ou une version publiée sans revue, laisserait des menaces sans parade ni acceptation, sans que personne en réponde."

[[threat.mitigation]]
description = "Une merge request qui ajoute un composant sans l'ajouter au modèle échoue et le nomme."
code = "scripts/check_threat_model.py::repository_problems"
test = "tests/test_threat_model.py::test_a_component_merged_without_updating_the_model_fails_and_is_named"

[[threat.mitigation]]
description = "La publication s'arrête, avant de rien publier, si le modèle n'a pas été revu pour sa version ou si une acceptation reste à signer."
code = "scripts/check_threat_model.py::release_problems"
test = "tests/test_release.py::test_the_tag_command_refuses_an_acceptance_left_to_sign"
