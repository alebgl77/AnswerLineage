# Proxy MCP

[[threat]]
id = "proxy/jeton-conserve"
name = "Un jeton de l'agent est conservé, journalisé ou rejoué par le proxy"
category = "information-disclosure"
boundary = "agent-proxy-mcp"
assets = ["jetons"]
description = "Le proxy voit passer l'en-tête d'autorisation et les échanges OAuth entre l'agent et le serveur MCP. Le garder, l'écrire dans un journal ou le présenter à un autre appel en ferait un vol de jeton."

[[threat.mitigation]]
description = "Le proxy relaie en-têtes, défi 401 et métadonnées OAuth tels quels, sans lire Authorization ni terminer OAuth."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_authorization.py::test_a_token_is_relayed_with_its_call_and_never_replayed_on_the_next"

[[threat.mitigation]]
description = "Un jeton qui traverse tout le parcours n'est retrouvé nulle part : événements, base, réponses, journaux, compteurs."
code = "proxy/src/answerlineage_proxy/events.py"
test = "tests/test_no_token_anywhere.py::test_a_token_crosses_the_whole_path_without_leaving_a_trace"

[[threat]]
id = "proxy/contenu-dans-l-evenement"
name = "Un contenu d'appel sort du proxy dans un événement, un journal ou une métrique"
category = "information-disclosure"
boundary = "agent-proxy-mcp"
assets = ["contenus"]
description = "Les arguments, le résultat d'outil ou un littéral de requête SQL recopiés dans l'événement, ou écrits par une bibliothèque qui journalise l'URL ou la requête."

[[threat.mitigation]]
description = "Les arguments et le résultat ne sortent que sous forme d'empreinte à clé."
code = "proxy/src/answerlineage_proxy/fingerprint.py"
test = "proxy/tests/test_fingerprint_capture.py::test_fingerprints_are_those_of_the_canonical_arguments_and_the_relayed_bytes"

[[threat.mitigation]]
description = "La forme d'une requête SQL ne garde aucun littéral, ou n'est pas gardée."
code = "proxy/src/answerlineage_proxy/sql.py"
test = "proxy/tests/test_sql_shape.py::test_a_customer_name_in_a_literal_never_reaches_the_event"

[[threat.mitigation]]
description = "Les journaux des bibliothèques sont coupés : rien de sensible n'atteint les événements ni les journaux."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_relay.py::test_nothing_sensitive_reaches_events_or_logs"

[[threat.mitigation]]
description = "L'événement ne porte que des noms, des empreintes et des compteurs : trois canaris (prompt, résultat, réponse) ne ressortent nulle part sur le parcours complet."
code = "proxy/src/answerlineage_proxy/events.py"
test = "tests/test_conformance_no_content.py::test_three_canaries_cross_the_whole_path_and_come_out_nowhere"

[[threat]]
id = "proxy/empreinte-retournee"
name = "Une empreinte est retournée en valeur par dictionnaire"
category = "information-disclosure"
boundary = "agent-proxy-mcp"
assets = ["contenus", "cle-des-empreintes"]
description = "Une valeur pauvre (un numéro de client, un montant) se retrouve en calculant l'empreinte de chaque candidat, si l'empreinte est sans clé ou si la clé fuit."

[[threat.mitigation]]
description = "Empreinte HMAC à clé : la même valeur a deux empreintes chez deux locataires."
code = "proxy/src/answerlineage_proxy/fingerprint.py"
test = "proxy/tests/test_fingerprint.py::test_two_tenants_get_two_fingerprints_for_the_same_value"

[[threat.mitigation]]
description = "La clé vient de l'environnement ou d'un fichier, jamais de la ligne de commande, et n'apparaît nulle part."
code = "proxy/src/answerlineage_proxy/config.py::fingerprint_key"
test = "proxy/tests/test_fingerprint_capture.py::test_the_key_appears_nowhere"

[[threat.mitigation]]
description = "En stdio, le serveur MCP que lance le proxy reçoit l'environnement sans la clé."
code = "proxy/src/answerlineage_proxy/stdio.py"
test = "proxy/tests/test_stdio.py::test_the_server_gets_the_environment_except_the_fingerprint_key"

[[threat]]
id = "proxy/page-web-hostile"
name = "Une page web ouverte sur le poste appelle des outils à travers le proxy local"
category = "elevation-of-privilege"
boundary = "agent-proxy-mcp"
assets = ["contenus", "jetons"]
description = "Par rebinding DNS ou par une requête d'une autre origine, une page atteint le proxy qui écoute sur la boucle locale et s'en sert pour appeler les outils de l'agent."
abuse_cases = ["emetteur/hote-relaye-proxy", "emetteur/origine-etrangere-proxy", "emetteur/autre-page-proxy"]

[[threat.mitigation]]
description = "Host et Origin sont contrôlés avant tout : un hôte rebondi est refusé avant d'atteindre le serveur."
code = "proxy/src/answerlineage_proxy/guard.py"
test = "proxy/tests/test_guard.py::test_a_rebound_host_is_refused_before_anything_reaches_the_server"

[[threat.mitigation]]
description = "Une page d'une autre origine, ou d'un autre site sans Origin, est refusée."
code = "proxy/src/answerlineage_proxy/guard.py"
test = "proxy/tests/test_guard.py::test_a_page_from_another_origin_cannot_call_a_tool_through_the_proxy"

[[threat]]
id = "proxy/appel-cache-au-lignage"
name = "Un appel d'outil échappe au lignage par des en-têtes ou un corps ambigus"
category = "repudiation"
boundary = "agent-proxy-mcp"
assets = ["lignage"]
description = "Un client fait dire aux en-têtes MCP autre chose que le corps, répète une clé, ou écrit un corps que deux analyseurs liraient différemment, pour qu'une lecture ne soit pas consignée, ou le soit sous un autre outil."
abuse_cases = ["entetes/methode-contredite", "entetes/nom-contredit", "capture/cle-method-repetee"]

[[threat.mitigation]]
description = "Le proxy décide sur le corps : un en-tête qui le contredit est signalé, jamais suivi."
code = "proxy/src/answerlineage_proxy/inspection.py"
test = "proxy/tests/test_relay.py::test_method_header_cannot_hide_a_tool_call_from_the_lineage"

[[threat.mitigation]]
description = "Un corps que deux analyseurs liraient différemment n'est pas décrit."
code = "proxy/src/answerlineage_proxy/inspection.py"
test = "proxy/tests/test_inspection.py::test_a_body_that_two_parsers_could_read_differently_is_not_described"

[[threat]]
id = "proxy/agent-retarde"
name = "La capture retarde ou bloque un appel d'agent"
category = "denial-of-service"
boundary = "agent-proxy-mcp"
assets = ["continuite-des-agents"]
description = "Une API d'ingestion lente ou en panne, une analyse SQL longue ou un puits défaillant feraient attendre l'agent, ou échouer son appel."

[[threat.mitigation]]
description = "La boîte d'envoi prend un événement par un ajout en mémoire, bornée, et n'attend rien."
code = "proxy/src/answerlineage_proxy/outbox.py"
test = "proxy/tests/test_outbox.py::test_emit_only_appends_the_event_and_waits_for_nothing"

[[threat.mitigation]]
description = "Un puits qui échoue n'atteint jamais l'appel."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_relay.py::test_failing_sink_never_reaches_the_call"

[[threat.mitigation]]
description = "Dix mille appels passent pendant que l'API est coupée, puis atteignent le graphe une fois."
code = "proxy/src/answerlineage_proxy/outbox.py"
test = "tests/test_outbox_chaos.py::test_ten_thousand_calls_pass_while_the_api_is_down_then_reach_the_graph_once"

[[threat.mitigation]]
description = "La synchronisation des quarantaines tourne à part : une API lente, muette ou hostile ne retarde aucun appel."
code = "proxy/src/answerlineage_proxy/quarantine.py"
test = "proxy/tests/test_quarantine.py::test_calls_are_relayed_without_delay_while_the_api_answers_with_hostile_responses"

[[threat.mitigation]]
description = "L'API injoignable au démarrage, le proxy démarre, relaie et reste en mode observer jusqu'à son retour."
code = "proxy/src/answerlineage_proxy/quarantine.py"
test = "tests/test_quarantine_end_to_end.py::test_an_api_down_at_startup_leaves_each_proxy_relaying_in_observe_mode_until_it_is_back"

[[threat.mitigation]]
description = "En stdio, le relais n'attend jamais l'inspection."
code = "proxy/src/answerlineage_proxy/stdio.py"
test = "proxy/tests/test_stdio.py::test_the_relay_never_waits_for_the_inspection"

[[threat]]
id = "proxy/entree-demesuree"
name = "Une entrée démesurée épuise la mémoire ou le temps du proxy"
category = "denial-of-service"
boundary = "agent-proxy-mcp"
assets = ["disponibilite", "continuite-des-agents"]
description = "Un corps géant, un message stdio sans fin, une requête SQL imbriquée sur des milliers de niveaux ou qui épuise l'analyseur."
abuse_cases = ["sql/parentheses-imbriquees", "sql/budget-epuise", "sql/requete-trop-grande"]

[[threat.mitigation]]
description = "Seul le début d'un corps est lu ; le reste passe au fil de l'eau."
code = "proxy/src/answerlineage_proxy/prefix.py"
test = "proxy/tests/test_relay.py::test_body_larger_than_the_inspected_size_is_streamed_and_described_by_its_start"

[[threat.mitigation]]
description = "L'analyse SQL tourne dans un processus à part, sous budget, et s'abandonne au-delà."
code = "proxy/src/answerlineage_proxy/analyzer.py"
test = "proxy/tests/test_analyzer.py::test_analysis_over_budget_is_abandoned_and_its_process_stopped"

[[threat.mitigation]]
description = "Une requête trop imbriquée est non résolue, sans plantage."
code = "proxy/src/answerlineage_proxy/sql.py"
test = "proxy/tests/test_sql.py::test_deeply_nested_query_is_unresolved_not_a_crash"

[[threat.mitigation]]
description = "En stdio, la mémoire des requêtes en attente est bornée."
code = "proxy/src/answerlineage_proxy/stdio.py"
test = "proxy/tests/test_stdio.py::test_the_memory_of_pending_requests_is_bounded"

[[threat]]
id = "proxy/sortie-du-prefixe"
name = "Une requête sort du préfixe du serveur MCP"
category = "elevation-of-privilege"
boundary = "agent-proxy-mcp"
assets = ["contenus"]
description = "Des segments « .. » dans le chemin feraient atteindre par le proxy une autre route du serveur amont que celle du serveur MCP."

[[threat.mitigation]]
description = "Un segment « .. » ne quitte pas le préfixe du serveur MCP."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_relay.py::test_a_dot_segment_cannot_leave_the_prefix_of_the_mcp_server"

[[threat]]
id = "proxy/requete-relayee-alteree"
name = "La requête relayée est altérée par l'étiquetage de son run"
category = "tampering"
boundary = "agent-proxy-mcp"
assets = ["contenus", "continuite-des-agents"]
description = "Sur option, le proxy écrit l'identifiant de run en commentaire dans la requête SQL relayée. Une écriture fautive changerait ce que le serveur exécute : un contexte de trace piégé qui fermerait le commentaire pour injecter du SQL, un corps resérialisé que le serveur lirait autrement, une longueur fausse, un corps compressé, signé ou ambigu modifié à l'aveugle."

[[threat.mitigation]]
description = "Seule la chaîne de la requête change, par un commentaire inséré à sa place : le reste du corps est recopié à l'octet près, et la longueur suit."
code = "proxy/src/answerlineage_proxy/tagging.py::comment_query"
test = "proxy/tests/test_tagging_relay.py::test_only_the_comment_of_the_run_differs_in_what_the_server_receives"

[[threat.mitigation]]
description = "Le commentaire vient d'un gabarit fixe où n'entre que l'identifiant de run, de forme canonique vérifiée : un contexte de trace piégé n'atteint pas la requête."
code = "proxy/src/answerlineage_proxy/warehouse.py::WarehouseTags"
test = "proxy/tests/test_tagging_relay.py::test_a_trapped_trace_context_never_reaches_the_query"

[[threat.mitigation]]
description = "Un corps ambigu, compressé, trop grand, ou lié par un en-tête d'empreinte, de signature ou d'argument recopié, part tel quel et se compte."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_tagging_relay.py::test_a_body_that_cannot_be_tagged_with_certainty_is_relayed_untouched_and_counted"

[[threat.mitigation]]
description = "En stdio, seule une ligne entière lue sans ambiguïté est étiquetée ; le reste passe tel quel."
code = "proxy/src/answerlineage_proxy/stdio.py"
test = "proxy/tests/test_tagging_relay.py::test_in_stdio_what_cannot_be_tagged_with_certainty_passes_untouched_and_is_counted"

[[threat.mitigation]]
description = "L'option est désactivée par défaut, nommée outil par outil, et un outil qu'elle ne nomme pas n'est jamais touché."
code = "proxy/src/answerlineage_proxy/cli.py::sql_tools_from_args"
test = "proxy/tests/test_tagging_relay.py::test_a_tool_without_the_option_is_never_touched"

[[threat]]
id = "proxy/nom-piege"
name = "Un nom piégé entre dans l'événement"
category = "tampering"
boundary = "agent-proxy-mcp"
assets = ["lignage"]
description = "Un nom d'outil, de table ou de colonne porte une instruction, une balise, un caractère invisible ou un retour à la ligne, que l'événement recopierait jusqu'à un lecteur ou un modèle."
abuse_cases = ["identifiants/outil-instruction", "invisibles/outil-largeur-nulle", "sql/table-hostile"]

[[threat.mitigation]]
description = "Un nom hors de la forme admise est signalé et jamais recopié."
code = "proxy/src/answerlineage_proxy/names.py"
test = "proxy/tests/test_relay.py::test_invalid_tool_name_is_flagged_and_never_copied"

[[threat.mitigation]]
description = "Le proxy et l'ingestion jugent un nom de la même façon."
code = "proxy/src/answerlineage_proxy/names.py"
test = "tests/test_contract_identifiers.py::test_on_any_text_the_proxy_and_the_ingestion_agree"

[[threat]]
id = "proxy/lecture-omise"
name = "L'analyse du SQL omet une colonne lue"
category = "tampering"
boundary = "agent-proxy-mcp"
assets = ["lignage"]
description = "Une colonne que l'analyse ne voit pas ferait écarter à tort une réponse touchée par une colonne fausse."

[[threat.mitigation]]
description = "Une table dont les colonnes ne sont pas sûres d'être complètes est lue en entier, ou la lecture est non résolue."
code = "proxy/src/answerlineage_proxy/sql.py"
test = "proxy/tests/test_sql.py::test_reads_whose_columns_cannot_be_listed_fall_back_to_the_whole_table"

[[threat.mitigation]]
description = "Une colonne sans préfixe, ambiguë dans une jointure, n'est pas devinée."
code = "proxy/src/answerlineage_proxy/sql.py"
test = "proxy/tests/test_sql.py::test_ambiguous_unprefixed_column_in_a_join_degrades_to_table_precision"

[[threat]]
id = "proxy/regle-de-lecture-trompee"
name = "Un outil non SQL lit autre chose que ce que sa règle de lecture déclare"
category = "tampering"
boundary = "agent-proxy-mcp"
assets = ["lignage"]
description = "Le proxy ne voit pas ce qu'un outil non SQL lit : il croit la règle que l'exploitant a déclarée. Un serveur MCP qui lit davantage laisse une lecture hors du lignage."

[[threat.mitigation]]
description = "Le fichier de règles est lui-même hostile : borné, refusé sans être recopié s'il est invalide."
code = "proxy/src/answerlineage_proxy/rules.py"
test = "proxy/tests/test_rules.py::test_a_hostile_or_invalid_file_is_refused_without_echoing_its_content"

[threat.acceptance]
reason = "Une règle de lecture se fie à l'outil : le proxy relaie l'appel sans en lire le résultat, et ne peut savoir ce que l'outil a lu au-delà de ce que déclare son exploitant."
consequence = "Une réponse fondée sur une lecture non déclarée n'est pas rappelée, et la couverture ne le montre pas, puisque l'appel est vu."

[[threat]]
id = "proxy/perimetre-usurpe"
name = "Une API compromise ou usurpée pousse aux proxys un faux périmètre en quarantaine"
category = "spoofing"
boundary = "api-proxy"
assets = ["perimetres-en-quarantaine", "continuite-des-agents"]
description = "Qui compromet l'API, ou se place sur le chemin qui y mène, répond aux proxys qui l'interrogent : il fait croire à une quarantaine qui n'existe pas, en tait une active, ou sert une réponse faite pour épuiser le proxy. Aujourd'hui le proxy ne fait rien des lectures du périmètre ; demain, il les annotera, puis pourra les bloquer."

[[threat.mitigation]]
description = "Seule l'adresse que règle l'exploitant est jointe : TLS vérifié, aucune redirection suivie, aucun mandataire lu de l'environnement."
code = "proxy/src/answerlineage_proxy/quarantine.py"
test = "proxy/tests/test_quarantine.py::test_a_redirect_of_the_api_is_not_followed"

[[threat.mitigation]]
description = "Une réponse est hostile : lue bornée et sans décompression, contrôlée en entier (JSON strict, identifiants de la forme de l'ingestion, nombre de quarantaines et de jeux bornés), écartée en entier sans être journalisée."
code = "proxy/src/answerlineage_proxy/quarantine.py::parse"
test = "proxy/tests/test_quarantine.py::test_a_hostile_response_is_refused_with_a_code_never_with_its_content"

[[threat.mitigation]]
description = "Une réponse écartée ou une panne gardent le dernier état connu, une heure au plus ; au-delà, le proxy revient en mode observer."
code = "proxy/src/answerlineage_proxy/quarantine.py"
test = "proxy/tests/test_quarantine.py::test_a_failure_keeps_the_last_state_for_an_hour_then_the_proxy_observes_again"

[[threat.mitigation]]
description = "Le proxy connaît le périmètre sans s'en servir : un faux périmètre ne change ni l'appel relayé ni son événement."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_quarantine.py::test_a_known_perimeter_changes_nothing_of_the_call_nor_of_its_event"

[threat.acceptance]
reason = "Le proxy n'authentifie pas encore l'API : il se fie au TLS de l'adresse que règle l'exploitant, et le périmètre n'agit encore sur aucun appel. Avant que le proxy annote ou bloque des lectures, la diffusion devra être authentifiée, par un périmètre signé ou l'identité vérifiée de l'API."
consequence = "Qui compromet l'API, ou la joint en http sur un réseau qu'il écoute, fait croire aux proxys une quarantaine fausse ou en tait une vraie : aujourd'hui sans effet sur les appels ; le jour où le proxy agira, il annotera ou bloquera à tort, ou laissera passer des lectures en quarantaine."

[[threat]]
id = "proxy/jeton-hors-audience"
name = "Une passerelle pousse à accepter un jeton hors de son audience"
category = "elevation-of-privilege"
boundary = "agent-proxy-mcp"
assets = ["jetons", "continuite-des-agents"]
description = "Placé en passerelle devant un serveur MCP dont les jetons sont liés à son URL, le proxy ne laisserait passer que des jetons émis pour une autre audience, que le serveur refuse. Pour en sortir, on relâcherait la vérification d'audience du serveur, qui accepterait alors un jeton émis pour n'importe quel service, ou l'on ferait terminer OAuth au proxy, qui détiendrait les jetons des agents."

[[threat.mitigation]]
description = "Le mode passerelle est refusé, avec son explication, pour un serveur dont les métadonnées de ressource protégée (RFC 9728) déclarent la ressource : la configuration s'arrête avant de servir."
code = "proxy/src/answerlineage_proxy/resource.py::check_gateway"
test = "proxy/tests/test_modes.py::test_through_a_gateway_a_token_bound_to_the_url_of_the_server_cannot_pass"

[[threat.mitigation]]
description = "L'exploitant qui sait les jetons du serveur liés à son URL le déclare : le mode passerelle est refusé sans rien lire du serveur."
code = "proxy/src/answerlineage_proxy/config.py::ProxySettings"
test = "proxy/tests/test_modes.py::test_the_gateway_mode_is_refused_when_the_operator_declares_bound_tokens"

[[threat.mitigation]]
description = "En mode transparent, le jeton du client atteint le serveur protégé octet pour octet, sous le nom du serveur, et le serveur l'accepte : rien n'oblige à relâcher l'audience."
code = "proxy/src/answerlineage_proxy/app.py"
test = "proxy/tests/test_modes.py::test_in_transparent_mode_the_token_of_the_client_passes_untouched_and_is_accepted"

[[threat]]
id = "proxy/metadonnees-hostiles"
name = "Les métadonnées OAuth du serveur MCP, lues au démarrage, retiennent ou trompent le proxy"
category = "denial-of-service"
boundary = "agent-proxy-mcp"
assets = ["disponibilite", "continuite-des-agents"]
description = "En mode passerelle, le proxy lit au démarrage les métadonnées de ressource protégée du serveur MCP. Un serveur hostile, ou ce qui se place sur le chemin, répond goutte à goutte, sans fin, par une redirection vers une autre adresse, un corps démesuré, compressé ou piégé, ou un texte fait pour entrer dans le journal ou dans un message d'erreur."

[[threat.mitigation]]
description = "Une réponse hostile est lue bornée, sans décompression, en JSON strict, et ne dit rien : le journal ne donne qu'un motif d'une liste fermée, rien de la réponse."
code = "proxy/src/answerlineage_proxy/resource.py::read_metadata"
test = "proxy/tests/test_modes.py::test_a_hostile_metadata_answer_says_nothing_and_is_never_copied"

[[threat.mitigation]]
description = "Seules les adresses bien connues du serveur réglé sont jointes : aucune redirection suivie, rien de l'environnement, aucun identifiant envoyé."
code = "proxy/src/answerlineage_proxy/resource.py::read_metadata"
test = "proxy/tests/test_modes.py::test_a_redirect_of_the_metadata_is_not_followed"

[[threat.mitigation]]
description = "Un serveur muet est abandonné dans le délai de lecture, et la passerelle démarre : la capture reste ouverte."
code = "proxy/src/answerlineage_proxy/resource.py::read_metadata"
test = "proxy/tests/test_modes.py::test_a_server_that_never_answers_is_given_up_within_the_deadline"

[[threat.mitigation]]
description = "Rien n'est lu en mode transparent, et rien jamais sur le chemin d'un appel : la lecture précède le démarrage."
code = "proxy/src/answerlineage_proxy/cli.py::main"
test = "proxy/tests/test_modes.py::test_in_transparent_mode_nothing_is_read_from_the_server_at_start"

[[threat]]
id = "proxy/port-d-administration"
name = "Le port d'administration fait sortir l'état du proxy ou sert à le gêner"
category = "information-disclosure"
boundary = "agent-proxy-mcp"
assets = ["contenus", "continuite-des-agents"]
description = "Le port d'administration dit si le proxy est vivant et prêt. Joint d'une autre machine, ou par une page web ouverte sur le poste, par réassociation DNS ou par une balise, il livrerait l'état du proxy, et un contenu s'il en servait ; occupé, il ferait retirer le réplica de la rotation. Un processus du poste, qui peut déjà arrêter le proxy par un signal, n'est pas visé."

[[threat.mitigation]]
description = "Le port d'administration n'écoute que sur la boucle locale et contrôle Host, Origin et Sec-Fetch-Site comme le port des appels : une page d'un autre site ne le lit pas."
code = "proxy/src/answerlineage_proxy/lifecycle.py::AdminApp"
test = "proxy/tests/test_lifecycle.py::test_a_page_of_another_site_cannot_read_the_admin_port"

[[threat.mitigation]]
description = "Il ne répond qu'une liste fermée de réponses fixes, sans donnée d'appel ni compteur, et ne relaie rien au serveur MCP."
code = "proxy/src/answerlineage_proxy/lifecycle.py::AdminApp"
test = "proxy/tests/test_lifecycle.py::test_the_admin_port_answers_a_closed_list_and_nothing_else"

[[threat]]
id = "proxy/arret-sous-charge"
name = "L'arrêt ou le redéploiement d'un proxy fait échouer des appels d'agents"
category = "denial-of-service"
boundary = "agent-proxy-mcp"
assets = ["continuite-des-agents"]
description = "Arrêté sous charge par un orchestrateur qui le redéploie ou réduit ses réplicas, un proxy qui fermerait son écoute avant que le répartiteur l'ait retiré, ou couperait ses appels en cours, ferait échouer des appels d'agents sans que le serveur MCP y soit pour rien."

[[threat.mitigation]]
description = "Au signal SIGTERM, le proxy se déclare non prêt et sert encore pendant le délai de retrait, puis laisse aux appels en cours le délai de grâce : deux réplicas sous charge derrière un répartiteur, l'un arrêté, aucun appel n'échoue."
code = "proxy/src/answerlineage_proxy/lifecycle.py::Lifecycle"
test = "proxy/tests/test_replicas.py::test_two_replicas_under_load_one_stopped_by_sigterm_no_call_fails"

[[threat.mitigation]]
description = "Un appel en cours quand l'écoute se ferme est rendu pendant le délai de grâce, et la boîte d'envoi ne se vide qu'ensuite."
code = "proxy/src/answerlineage_proxy/lifecycle.py::Lifecycle"
test = "proxy/tests/test_lifecycle.py::test_the_outbox_is_flushed_once_the_calls_in_flight_are_answered"

[[threat.mitigation]]
description = "Un appel plus long que le délai de grâce est coupé : sa réponse reste inachevée, le client sait qu'elle est tronquée, et son événement dit l'échec."
code = "proxy/src/answerlineage_proxy/app.py::McpProxy"
test = "proxy/tests/test_lifecycle.py::test_a_call_longer_than_the_grace_delay_is_cut_and_its_event_says_it_failed"

# API

[[threat]]
id = "api/emetteur-usurpe"
name = "Un émetteur envoie des événements au nom d'un autre"
category = "spoofing"
boundary = "emetteur-ingestion"
assets = ["lignage"]
description = "L'ingestion n'authentifie pas les émetteurs : quiconque la joint peut déclarer une lecture au nom du proxy, ou des rejeux au nom d'un autre émetteur, et la lecture inventée entre dans le graphe. Il peut aussi envoyer de faux tests de qualité en échec, qui proposent des incidents."
abuse_cases = ["emetteur/evenement-au-nom-du-proxy", "emetteur/doublons-au-nom-d-un-autre"]

[[threat.mitigation]]
description = "Un test en échec ne fait que proposer un incident : ni incident, ni analyse, ni annonce, ni quarantaine sans un humain."
code = "workers/src/answerlineage_workers/proposals.py::process_signals"
test = "workers/tests/test_proposals.py::test_a_failing_quality_test_proposes_a_signaled_incident_bound_to_its_column"

[threat.acceptance]
reason = "Les émetteurs ne sont pas encore authentifiés : l'API est faite pour la boucle locale ou un réseau de confiance, comme le dit la politique de sécurité."
consequence = "Un tiers qui joint l'ingestion peut inventer des lectures, donc faire rappeler des réponses saines, fausser le décompte des doublons d'un émetteur, et faire proposer des incidents qu'un humain devra écarter."

[[threat]]
id = "api/releve-usurpe"
name = "Un relevé de couverture est publié au nom d'un autre émetteur"
category = "spoofing"
boundary = "emetteur-ingestion"
assets = ["lignage"]
description = "Un relevé non authentifié gonfle les appels vus d'une fenêtre, et la fusion au plus grand ne le défait pas."
abuse_cases = ["emetteur/releve-au-nom-d-un-autre", "emetteur/releve-emetteur-hostile"]

[[threat.mitigation]]
description = "Un relevé incohérent ou dont l'émetteur n'a pas la forme d'un nom est refusé sans être cité."
code = "api/src/answerlineage_api/ingest/coverage.py"
test = "api/tests/test_coverage_report.py::test_a_trapped_emitter_is_refused_without_being_cited"

[threat.acceptance]
reason = "Un relevé n'est pas authentifié plus qu'un événement, et deux relevés d'une même fenêtre se fusionnent au plus grand."
consequence = "Un tiers qui joint l'ingestion peut faire croire à des appels que le graphe n'a pas : la couverture d'une fenêtre se lit alors partielle à tort."

[[threat]]
id = "api/appelant-non-authentifie"
name = "Un appelant qui joint l'API lit le lignage et déclare des incidents"
category = "information-disclosure"
boundary = "lecteur-lecture"
assets = ["lignage", "destinataires"]
description = "L'API de lecture, la déclaration d'incidents, leur quarantaine, la décision des incidents proposés et l'explorateur n'authentifient pas leurs appelants : qui les joint lit les noms des jeux de données, des agents et des outils, les empreintes des réponses et les pseudonymes des destinataires, met un incident en quarantaine ou la lève, confirme ou écarte un incident proposé."

[[threat.mitigation]]
description = "La démonstration ne publie son seul port que sur la boucle locale."
code = "scripts/check_policy.py::check_compose"
test = "tests/test_policy.py::test_a_port_published_beyond_the_loopback_fails"

[threat.acceptance]
reason = "L'API n'authentifie pas encore ses appelants : elle est faite pour la boucle locale ou derrière un contrôle d'accès."
consequence = "Exposée sans contrôle d'accès, elle livre le lignage à qui la joint et le laisse déclarer des incidents, ou confirmer ceux qu'un test propose, donc lancer des analyses et des annonces, écarter un incident proposé, et mettre un incident en quarantaine ou la lever."

[[threat]]
id = "api/rejeu-non-authentifie"
name = "Un appelant qui joint l'API lit la file de rebut et la rejoue"
category = "elevation-of-privilege"
boundary = "lecteur-lecture"
assets = ["disponibilite", "lignage"]
description = "La file de rebut et son rejeu n'authentifient pas leurs appelants : qui joint l'API remet en file les événements que la projection a refusés, une action d'exploitation."

[[threat.mitigation]]
description = "Un rejeu remet en file un nombre borné d'événements, sous le délai des lectures ; son corps est lu borné et un champ inconnu le refuse sans rien rejouer."
code = "api/src/answerlineage_api/ingest/dead_letters.py::replay_dead_letters"
test = "api/tests/test_dead_letters.py::test_a_replay_moves_at_most_its_limit_the_oldest_failures_first"

[[threat.mitigation]]
description = "Deux rejeux simultanés ne remettent jamais un événement deux fois en file, et la projection d'un événement rejoué est idempotente."
code = "api/src/answerlineage_api/ingest/dead_letters.py::replay"
test = "api/tests/test_dead_letters.py::test_concurrent_replays_put_each_event_back_once"

[threat.acceptance]
reason = "Le rebut se lit et se rejoue sans authentification, comme le reste de l'API : elle est faite pour la boucle locale ou derrière un contrôle d'accès. Le rejeu reviendra à l'administrateur quand l'API distinguera les rôles de ses appelants."
consequence = "Exposée sans contrôle d'accès, l'API laisse qui la joint lire les émetteurs et les identifiants des événements au rebut, et les remettre en file autant de fois qu'il le veut : les workers refont un travail sans effet sur le graphe, et un événement qui échoue encore revient au rebut."

