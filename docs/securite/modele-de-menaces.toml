code = "workers/src/answerlineage_workers/reemission.py::retry_delay"
test = "workers/tests/test_reemission.py::test_a_destination_down_then_back_loses_nothing"

[[threat.mitigation]]
description = "Deux workers réclament leurs lots avec FOR UPDATE SKIP LOCKED : jamais deux fois le même événement."
code = "workers/src/answerlineage_workers/reemission.py::reemit_batch"
test = "workers/tests/test_reemission.py::test_two_workers_never_send_an_event_twice"

[[threat]]
id = "workers/webhook-usurpe"
name = "Un tiers se fait passer pour AnswerLineage auprès du récepteur des webhooks"
category = "spoofing"
boundary = "workers-recepteur"
assets = ["annonces-d-incident"]
description = "Quiconque joint le récepteur lui envoie un faux message : un incident inventé, une analyse dite faite, des décomptes faux. Sans signature, ou avec une vérification qui accepte un corps changé, le récepteur déclencherait sur sa parole une alerte ou un rappel."

[[threat.mitigation]]
description = "Chaque message est signé, HMAC-SHA-256 sous le secret partagé, sur l'heure d'émission et le corps ; la fonction de vérification de référence refuse une signature fausse et un corps altéré."
code = "workers/src/answerlineage_workers/webhook_signature.py::verify"
test = "workers/tests/test_webhook_signature.py::test_a_false_signature_and_an_altered_body_are_refused"

[[threat.mitigation]]
description = "Des vecteurs publiés, figés avec le format, disent ce qu'un récepteur doit accepter et refuser : toute autre écriture de la vérification s'y juge."
code = "workers/src/answerlineage_workers/webhook_signature.py::verify"
test = "workers/tests/test_webhook_signature.py::test_the_receiver_decides_as_the_vectors_say"

[[threat.mitigation]]
description = "De bout en bout, un récepteur qui vérifie avec la fonction de référence accepte les messages des workers et refuse une signature fausse et un corps altéré."
code = "workers/src/answerlineage_workers/webhooks.py::deliver_batch"
test = "tests/test_webhooks_end_to_end.py::test_a_change_of_state_leaves_signed_in_less_than_a_minute_and_a_replay_is_refused"

[threat.acceptance]
reason = "Le secret est symétrique : le récepteur le garde, en clair, pour vérifier, et peut donc signer comme les workers. Sa rotation est manuelle : AnswerLineage accepte deux secrets le temps d'une rotation, mais ne garde pas le secret du récepteur et ne le fait pas tourner à sa place."
consequence = "Qui lit le secret chez le récepteur ou dans l'environnement des workers forge des messages que le récepteur accepte, jusqu'à la rotation suivante."

[[threat]]
id = "workers/webhook-rejoue"
name = "Un message capté est rejoué au récepteur des webhooks"
category = "tampering"
boundary = "workers-recepteur"
assets = ["annonces-d-incident"]
description = "Un message authentique, capté sur le réseau, dans un journal du récepteur ou chez un intermédiaire, est renvoyé tel quel : sa signature reste juste. Le récepteur annoncerait deux fois le même changement d'état, ou une analyse ancienne comme nouvelle."

[[threat.mitigation]]
description = "La signature couvre l'heure d'émission : la vérification de référence refuse un message émis hors d'une tolérance de cinq minutes, avant comme après l'horloge du récepteur."
code = "workers/src/answerlineage_workers/webhook_signature.py::verify"
test = "workers/tests/test_webhook_signature.py::test_a_signature_replayed_outside_the_window_is_refused"

[[threat.mitigation]]
description = "Chaque message porte un identifiant de livraison, le même d'un envoi à l'autre : le récepteur écarte par lui un rejeu dans la fenêtre comme un renvoi."
code = "workers/src/answerlineage_workers/webhooks.py::message"
test = "workers/tests/test_webhooks.py::test_a_receiver_down_then_back_loses_nothing_and_keeps_the_delivery_id"

[threat.acceptance]
reason = "La vérification de référence ne garde aucun état : écarter, par son identifiant de livraison, un message rejoué dans la fenêtre de tolérance revient au récepteur."
consequence = "Un récepteur qui ne garde pas les identifiants vus accepte, pendant cinq minutes, un message capté et renvoyé : il annonce deux fois le même changement d'état."

[[threat]]
id = "workers/webhook-secret-divulgue"
