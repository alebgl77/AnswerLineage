[project]
name = "answerlineage-corpus"
version = "0.0.0"
description = "Corpus d'AnswerLineage : une entreprise synthétique à vérité connue, pour tester et démontrer sans donnée réelle."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[project.scripts]
answerlineage-corpus = "answerlineage_corpus.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_corpus"]
