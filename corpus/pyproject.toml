[project]
name = "answerlineage-corpus"
version = "0.0.0"
description = "Corpus d'AnswerLineage : une entreprise synthétique à vérité connue, pour tester et démontrer sans donnée réelle."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
answerlineage-corpus = "answerlineage_corpus.cli:main"

[project.urls]
Source = "https://github.com/alebgl77/AnswerLineage"
Documentation = "https://github.com/alebgl77/AnswerLineage/tree/main/docs"
Issues = "https://github.com/alebgl77/AnswerLineage/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_corpus"]
