[project]
name = "answerlineage-conformance"
version = "0.0.0"
description = "Kit de conformité d'AnswerLineage : juge un émetteur sur les événements, les journaux et les métriques qu'il a produits."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "answerlineage-workers",
    "jsonschema>=4.25",
]

[project.scripts]
answerlineage-conformance = "answerlineage_conformance.cli:main"

[tool.uv.sources]
answerlineage-workers = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlineage_conformance"]
